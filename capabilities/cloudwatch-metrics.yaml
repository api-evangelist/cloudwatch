      path: /
      operations:
      - name: putmetricdata
        method: POST
        description: Aws Cloudwatch Publish Metric Data Points to Cloudwatch
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
