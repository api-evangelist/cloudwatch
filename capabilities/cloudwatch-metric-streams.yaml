    resources:
    - name: '#ListMetricStreams'
      path: /#ListMetricStreams
      operations:
      - name: listmetricstreams
        method: POST
        description: Aws Cloudwatch List the Metric Streams in Your Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: '#PutMetricStream'
      path: /#PutMetricStream
      operations:
      - name: putmetricstream
        method: POST
        description: Aws Cloudwatch Create or Update a Metric Stream
        outputRawFormat: json
