    port: 9090
    transport: http
    description: MCP adapter for AWS CloudWatch Amazon CloudWatch API — Composite Alarms. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: aws-cloudwatch-create-update-composite
      description: Aws Cloudwatch Create or Update a Composite Alarm
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloudwatch-composite-alarms.putcompositealarm
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
