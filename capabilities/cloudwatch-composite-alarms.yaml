  description: 'AWS CloudWatch Amazon CloudWatch API — Composite Alarms. 1 operations. Lead operation: Aws Cloudwatch Create
    or Update a Composite Alarm. Self-contained Naftiko capability covering one Cloudwatch business surface.'
  tags:
  - Cloudwatch
  - Composite Alarms
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CLOUDWATCH_API_KEY: CLOUDWATCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloudwatch-composite-alarms
    baseUri: https://monitoring.{region}.amazonaws.com
    description: AWS CloudWatch Amazon CloudWatch API — Composite Alarms business capability. Self-contained, no shared references.
    resources:
    - name: '#PutCompositeAlarm'
      path: /#PutCompositeAlarm
      operations:
      - name: putcompositealarm
        method: POST
        description: Aws Cloudwatch Create or Update a Composite Alarm
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CLOUDWATCH_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: cloudwatch-composite-alarms-rest
    port: 8080
    description: REST adapter for AWS CloudWatch Amazon CloudWatch API — Composite Alarms. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/putcompositealarm
      name: putcompositealarm
      description: 'REST surface for #PutCompositeAlarm.'
      operations:
      - method: POST
        name: putcompositealarm
        description: Aws Cloudwatch Create or Update a Composite Alarm
        call: cloudwatch-composite-alarms.putcompositealarm
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
