        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: '#ListTagsForResource'
      path: /#ListTagsForResource
      operations:
      - name: listtagsforresource
        method: POST
        description: Aws Cloudwatch List Tags for a Cloudwatch Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
