description: 'FOCUS-aligned FinOps for Amazon CloudWatch: pure pay-as-you-go metering across metrics, API
  requests, alarms, logs (ingest / storage / query / Live Tail), dashboards, Contributor Insights, Synthetics,
  RUM, Application Signals, Internet Monitor and Network Flow Monitor. Costs land in AWS Cost and Usage
  Reports (CUR / CUR 2.0) under service code `AmazonCloudWatch` with usage-type granularity, and CloudWatch
  itself emits service-quota usage metrics that can be alarmed.'
