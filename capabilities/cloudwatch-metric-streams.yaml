      description: 'REST surface for #ListMetricStreams.'
      operations:
      - method: POST
        name: listmetricstreams
        description: Aws Cloudwatch List the Metric Streams in Your Account
        call: cloudwatch-metric-streams.listmetricstreams
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/putmetricstream
      name: putmetricstream
      description: 'REST surface for #PutMetricStream.'
      operations:
      - method: POST
        name: putmetricstream
        description: Aws Cloudwatch Create or Update a Metric Stream
        call: cloudwatch-metric-streams.putmetricstream
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
