  - name: rum_events
    description: CloudWatch RUM events recorded from end-user browsers.
    unit: event
    aggregation: sum
    dimensions:
      - region
      - app_monitor
  - name: application_signals_data
    description: Application Signals telemetry ingestion volume.
    unit: GB
    aggregation: sum
    dimensions:
      - region
principles:
  - name: Visibility
    description: Use AWS Cost Explorer and the Cost and Usage Report (CUR / CUR 2.0) filtered to service
      `AmazonCloudWatch` for line-item visibility. CloudWatch also exposes its own usage metrics under the
      `AWS/Usage` namespace so engineers can alarm on quota burn-down.
  - name: Allocation
    description: Tag log groups, alarms, dashboards and synthetics canaries; AWS-generated and user-defined
      tags flow through to CUR for chargeback. Use Account/OU and Region as natural allocation dimensions.
  - name: Optimization
    description: Drop noisy log groups, set retention policies on archived logs, batch PutMetricData (up
      to 1,000 data points per call), favor metric math over additional custom metrics, use CloudWatch Logs
      Infrequent Access log class for cold logs, and consolidate alarms via composite alarms.
  - name: Accountability
    description: Assign per-team budget alerts in AWS Budgets keyed on the CloudWatch service filter; review
      the top usage-types (DataProcessing-Bytes, Requests, AlarmMonitorUsage, MetricMonitorUsage) monthly.
